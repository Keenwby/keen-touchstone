[project]
name = "keen-touchstone"
version = "0.1.0.dev0"
description = "Agentic eval & reliability harness: pass^k with confidence intervals and reliability decay curves, over Inspect AI logs and OTel GenAI traces — no golden dataset required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Keen" }]
keywords = ["llm", "agents", "evaluation", "reliability", "pass-hat-k", "inspect-ai", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "inspect-ai~=0.3.244",
    "numpy>=1.26",
    "scipy>=1.11",
    "click>=8.1.3",
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "rich>=13.3.3",
]

[project.scripts]
touchstone = "keen_touchstone.cli:main"
kts = "keen_touchstone.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keen_touchstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # deliberate typographic ×/→ in user-facing strings
